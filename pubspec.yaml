name: nexus_video
description: "Nexus Video - a local-first Bilibili, YouTube, X, and Douyin media collector with HarmonyOS support."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  crypto: ^3.0.6
  file_selector: ^1.0.3
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  xml: ^6.5.0
  youtube_explode_dart: ^3.1.0
  http: ^1.6.0
  flutter_inappwebview: ^6.1.5

dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
